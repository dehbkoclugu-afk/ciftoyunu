name: CI

on:
  pull_request:
  push:
    branches: [claude-code]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run validate

      - name: Report content inventory
        run: npm run content:report

      - name: Check Expo project
        run: npm run expo:doctor

      - name: Export web smoke build
        run: npm run export:web
